<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff - MERCIA</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        body { background: #F2F5EA; }
        .page-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px; }
        .page-header h1 { font-size:28px;color:#2C363F; }
        .header-actions { display:flex;gap:10px; }
        .toolbar { display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px; }
        .toolbar input, .toolbar select {
            padding:9px 14px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;
            font-family:inherit;background:white;transition:border-color 0.2s;
        }
        .toolbar input:focus, .toolbar select:focus { outline:none;border-color:#E39774; }
        .toolbar input { min-width:260px; }
        .btn { padding:9px 18px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s; }
        .btn-accent { background:#E39774;color:white; }
        .btn-accent:hover { background:#d17d5e; }
        .btn-secondary { background:#2C363F;color:white; }
        .btn-secondary:hover { background:#1e2830; }
        .staff-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px; }
        .staff-card {
            background:white;border-radius:18px;padding:24px;
            box-shadow:0 4px 20px rgba(0,0,0,0.07);transition:transform 0.2s,box-shadow 0.2s;
            position:relative;
        }
        .staff-card:hover { transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,0,0,0.12); }
        .staff-avatar {
            width:60px;height:60px;border-radius:50%;background:#2C363F;
            display:flex;align-items:center;justify-content:center;color:white;
            font-size:22px;font-weight:700;margin-bottom:14px;
        }
        .staff-name { font-size:18px;font-weight:700;color:#2C363F;margin-bottom:4px; }
        .staff-role { color:#E39774;font-size:13px;font-weight:600;margin-bottom:10px; }
        .staff-info { font-size:13px;color:#7b8591;line-height:1.8; }
        .staff-status { position:absolute;top:18px;right:18px; }
        .status-badge { padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700; }
        .badge-active { background:#d6f5e4;color:#1e5f34; }
        .badge-inactive { background:#fde8e8;color:#c0392b; }
        .card-actions { display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid #f0f0f0; }
        .btn-sm { padding:5px 14px;font-size:12px;border-radius:6px;border:none;cursor:pointer;font-weight:600; }
        .btn-edit { background:#dce7ff;color:#2f56b7; }
        .btn-delete { background:#fde8e8;color:#c0392b; }
        .btn-view { background:#f0f0f0;color:#555; }
        .btn-edit:hover { background:#b8d0ff; }
        .btn-delete:hover { background:#fbc5c5; }

        /* Modal */
        .modal-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center; }
        .modal-overlay.show { display:flex; }
        .modal { background:white;border-radius:20px;padding:32px;max-width:720px;width:90%;max-height:88vh;overflow-y:auto;position:relative; }
        .modal h2 { margin-bottom:20px;color:#2C363F;font-size:22px; }
        .form-grid { display:grid;grid-template-columns:1fr 1fr;gap:14px; }
        .form-group-m { display:flex;flex-direction:column;gap:5px; }
        .form-group-m.full { grid-column:1/-1; }
        .form-group-m label { font-size:13px;font-weight:600;color:#555; }
        .form-group-m input, .form-group-m select, .form-group-m textarea {
            padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;font-family:inherit;
        }
        .form-group-m input:focus, .form-group-m select:focus { outline:none;border-color:#E39774; }
        .modal-footer { display:flex;gap:10px;justify-content:flex-end;margin-top:20px; }
        .btn-cancel { background:#f0f0f0;color:#555;padding:9px 20px;border:none;border-radius:8px;cursor:pointer;font-size:14px; }
        .close-btn { position:absolute;top:16px;right:20px;background:none;border:none;font-size:22px;cursor:pointer;color:#999; }
        .confirm-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;align-items:center;justify-content:center; }
        .confirm-overlay.show { display:flex; }
        .confirm-box { background:white;border-radius:16px;padding:28px;max-width:400px;width:90%;text-align:center; }
        .confirm-box h3 { margin-bottom:10px;color:#2C363F; }
        .confirm-box p { color:#7b8591;margin-bottom:20px; }
        .confirm-actions { display:flex;gap:10px;justify-content:center; }
        .toast { position:fixed;bottom:24px;right:24px;background:#2C363F;color:white;padding:12px 20px;border-radius:10px;font-size:14px;z-index:3000;transform:translateY(80px);opacity:0;transition:all 0.3s; }
        .toast.show { transform:translateY(0);opacity:1; }
        .toast.success { background:#27ae60; }
        .toast.error { background:#c0392b; }
        .empty-state { text-align:center;padding:60px 20px;color:#7b8591;grid-column:1/-1; }
        .empty-state span { font-size:48px;display:block;margin-bottom:12px; }
        .section-divider { grid-column:1/-1;border:none;border-top:1px solid #e0e0e0;margin:8px 0; }
    </style>
</head>
<body>
<header>
    <div class="navbar">
        <a href="../dashboard.html" class="logo">MERCIA</a>
        <nav>
            <ul class="nav-links">
                <li><a href="../dashboard.html">Dashboard</a></li>
                <li><a href="inventory.html">Inventory</a></li>
                <li><a href="billing.html">Billing</a></li>
                <li><a href="customers.html">Customers</a></li>
                <li><a href="staff.html">Staff</a></li>
                <li><a href="reports.html">Reports</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </nav>
    </div>
</header>

<main style="max-width:1240px;margin:32px auto;padding:0 20px;">
    <div class="page-header">
        <div>
            <h1>👥 Staff Management</h1>
            <p style="color:#7b8591;font-size:14px;margin-top:4px;" id="staff-count">Loading...</p>
        </div>
        <div class="header-actions">
            <!-- Attendance link button as requested -->
            <a href="attendance.html" class="btn btn-secondary">📅 Mark Attendance</a>
            <button class="btn btn-accent" onclick="openAddModal()">+ Add Staff</button>
        </div>
    </div>

    <div class="toolbar">
        <input type="text" id="search-input" placeholder="🔍 Search by name, phone, email, department..." oninput="fetchStaff()">
        <select id="filter-status" onchange="fetchStaff()">
            <option value="">All Status</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
        </select>
    </div>

    <div class="staff-grid" id="staff-grid">
        <div class="empty-state"><span>⏳</span>Loading staff...</div>
    </div>
</main>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="staff-modal">
    <div class="modal">
        <button class="close-btn" onclick="closeModal()">✕</button>
        <h2 id="modal-title">Add Staff Member</h2>
        <form id="staff-form">
            <div class="form-grid">
                <!-- Personal Info -->
                <div class="form-group-m full" style="margin-bottom:4px;">
                    <label style="font-size:15px;color:#2C363F;font-weight:700;">👤 Personal Information</label>
                </div>
                <div class="form-group-m">
                    <label>Full Name *</label>
                    <input type="text" id="f-name" required placeholder="e.g. Riya Sharma">
                </div>
                <div class="form-group-m">
                    <label>Phone *</label>
                    <input type="tel" id="f-phone" required placeholder="e.g. 9876543210">
                </div>
                <div class="form-group-m">
                    <label>Alternative Phone</label>
                    <input type="tel" id="f-altPhone" placeholder="Optional">
                </div>
                <div class="form-group-m">
                    <label>Email</label>
                    <input type="email" id="f-email" placeholder="staff@example.com">
                </div>
                <div class="form-group-m">
                    <label>Date of Birth</label>
                    <input type="date" id="f-dob">
                </div>
                <div class="form-group-m">
                    <label>ID Proof</label>
                    <input type="text" id="f-idProof" placeholder="Aadhaar / PAN">
                </div>

                <hr class="section-divider">

                <!-- Job Info -->
                <div class="form-group-m full" style="margin-bottom:4px;">
                    <label style="font-size:15px;color:#2C363F;font-weight:700;">💼 Job Information</label>
                </div>
                <div class="form-group-m">
                    <label>Role / Designation</label>
                    <input type="text" id="f-role" placeholder="e.g. Cashier, Manager">
                </div>
                <div class="form-group-m">
                    <label>Department</label>
                    <input type="text" id="f-department" placeholder="e.g. Sales, Operations">
                </div>
                <div class="form-group-m">
                    <label>Joining Date</label>
                    <input type="date" id="f-joiningDate">
                </div>
                <div class="form-group-m">
                    <label>Salary (₹)</label>
                    <input type="number" id="f-salary" min="0" placeholder="Monthly salary">
                </div>
                <div class="form-group-m">
                    <label>Status</label>
                    <select id="f-status">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <div class="form-group-m">
                    <label>Emergency Contact</label>
                    <input type="tel" id="f-emergency" placeholder="Emergency phone">
                </div>

                <hr class="section-divider">

                <!-- Address -->
                <div class="form-group-m full" style="margin-bottom:4px;">
                    <label style="font-size:15px;color:#2C363F;font-weight:700;">📍 Address</label>
                </div>
                <div class="form-group-m full">
                    <label>Address</label>
                    <input type="text" id="f-address" placeholder="Street / House No.">
                </div>
                <div class="form-group-m">
                    <label>City</label>
                    <input type="text" id="f-city" placeholder="e.g. Udaipur">
                </div>
                <div class="form-group-m">
                    <label>State</label>
                    <input type="text" id="f-state" placeholder="e.g. Rajasthan">
                </div>
                <div class="form-group-m">
                    <label>Country</label>
                    <input type="text" id="f-country" value="India">
                </div>
                <div class="form-group-m">
                    <label>PIN Code</label>
                    <input type="text" id="f-pinCode" placeholder="e.g. 313001">
                </div>
                <div class="form-group-m full">
                    <label>Notes</label>
                    <textarea id="f-notes" rows="2" placeholder="Any additional notes..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn btn-accent" id="save-btn">Save</button>
            </div>
        </form>
    </div>
</div>

<!-- Delete Confirm -->
<div class="confirm-overlay" id="confirm-modal">
    <div class="confirm-box">
        <h3>Remove Staff Member?</h3>
        <p id="confirm-msg">This action cannot be undone.</p>
        <div class="confirm-actions">
            <button class="btn-cancel" onclick="closeConfirm()">Cancel</button>
            <button class="btn btn-accent" style="background:#c0392b;" id="confirm-yes-btn">Remove</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="../js/auth.js"></script>
<script>
    let editingId = null;
    let deleteId = null;

    function showToast(msg, type = 'success') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = `toast ${type} show`;
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    function initials(name) {
        return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
    }

    async function fetchStaff() {
        const search = document.getElementById('search-input').value;
        const status = document.getElementById('filter-status').value;
        const params = new URLSearchParams({ search, status });

        const data = await merciaApi(`/api/staff?${params}`);
        const grid = document.getElementById('staff-grid');
        document.getElementById('staff-count').textContent = `${data.total} team member(s)`;

        if (!data.data || data.data.length === 0) {
            grid.innerHTML = `<div class="empty-state"><span>👥</span>No staff found. Add your first team member!</div>`;
            return;
        }

        grid.innerHTML = data.data.map(member => `
            <div class="staff-card">
                <div class="staff-status">
                    <span class="status-badge ${member.status === 'active' ? 'badge-active' : 'badge-inactive'}">
                        ${member.status === 'active' ? '● Active' : '● Inactive'}
                    </span>
                </div>
                <div class="staff-avatar">${initials(member.name)}</div>
                <div class="staff-name">${member.name}</div>
                <div class="staff-role">${member.role || 'Staff'} ${member.department ? '· ' + member.department : ''}</div>
                <div class="staff-info">
                    📱 ${member.phone}<br>
                    ${member.email ? '✉️ ' + member.email + '<br>' : ''}
                    ${member.city ? '📍 ' + member.city + (member.state ? ', ' + member.state : '') + '<br>' : ''}
                    ${member.salary ? '💰 ₹' + Number(member.salary).toLocaleString('en-IN') + '/mo' : ''}
                </div>
                <div class="card-actions">
                    <button class="btn btn-sm btn-view" onclick="openEditModal('${member._id}')">View / Edit</button>
                    <button class="btn btn-sm btn-delete" onclick="confirmDelete('${member._id}','${member.name}')">Remove</button>
                </div>
            </div>
        `).join('');
    }

    function openAddModal() {
        editingId = null;
        document.getElementById('modal-title').textContent = 'Add Staff Member';
        document.getElementById('staff-form').reset();
        document.getElementById('f-country').value = 'India';
        document.getElementById('f-status').value = 'active';
        document.getElementById('staff-modal').classList.add('show');
    }

    async function openEditModal(id) {
        editingId = id;
        document.getElementById('modal-title').textContent = 'Edit Staff Member';
        const data = await merciaApi(`/api/staff/${id}`);
        const m = data.data;

        document.getElementById('f-name').value = m.name || '';
        document.getElementById('f-phone').value = m.phone || '';
        document.getElementById('f-altPhone').value = m.alternativePhone || '';
        document.getElementById('f-email').value = m.email || '';
        document.getElementById('f-dob').value = m.dateOfBirth ? m.dateOfBirth.split('T')[0] : '';
        document.getElementById('f-idProof').value = m.idProof || '';
        document.getElementById('f-role').value = m.role || '';
        document.getElementById('f-department').value = m.department || '';
        document.getElementById('f-joiningDate').value = m.joiningDate ? m.joiningDate.split('T')[0] : '';
        document.getElementById('f-salary').value = m.salary || '';
        document.getElementById('f-status').value = m.status || 'active';
        document.getElementById('f-emergency').value = m.emergencyContact || '';
        document.getElementById('f-address').value = m.address || '';
        document.getElementById('f-city').value = m.city || '';
        document.getElementById('f-state').value = m.state || '';
        document.getElementById('f-country').value = m.country || 'India';
        document.getElementById('f-pinCode').value = m.pinCode || '';
        document.getElementById('f-notes').value = m.notes || '';

        document.getElementById('staff-modal').classList.add('show');
    }

    function closeModal() {
        document.getElementById('staff-modal').classList.remove('show');
        editingId = null;
    }

    document.getElementById('staff-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById('save-btn');
        saveBtn.disabled = true; saveBtn.textContent = 'Saving...';

        const body = {
            name: document.getElementById('f-name').value.trim(),
            phone: document.getElementById('f-phone').value.trim(),
            alternativePhone: document.getElementById('f-altPhone').value.trim(),
            email: document.getElementById('f-email').value.trim(),
            dateOfBirth: document.getElementById('f-dob').value || undefined,
            idProof: document.getElementById('f-idProof').value.trim(),
            role: document.getElementById('f-role').value.trim(),
            department: document.getElementById('f-department').value.trim(),
            joiningDate: document.getElementById('f-joiningDate').value || undefined,
            salary: Number(document.getElementById('f-salary').value) || undefined,
            status: document.getElementById('f-status').value,
            emergencyContact: document.getElementById('f-emergency').value.trim(),
            address: document.getElementById('f-address').value.trim(),
            city: document.getElementById('f-city').value.trim(),
            state: document.getElementById('f-state').value.trim(),
            country: document.getElementById('f-country').value.trim(),
            pinCode: document.getElementById('f-pinCode').value.trim(),
            notes: document.getElementById('f-notes').value.trim(),
        };

        const url = editingId ? `/api/staff/${editingId}` : '/api/staff';
        const method = editingId ? 'PUT' : 'POST';

        const data = await merciaApi(url, { method, body: JSON.stringify(body) });

        if (data.success) {
            showToast(editingId ? 'Staff updated!' : 'Staff added!', 'success');
            closeModal();
            fetchStaff();
        } else {
            showToast(data.message || 'Error saving staff.', 'error');
        }
        saveBtn.disabled = false; saveBtn.textContent = 'Save';
    });

    function confirmDelete(id, name) {
        deleteId = id;
        document.getElementById('confirm-msg').textContent = `Remove "${name}" from the team? This cannot be undone.`;
        document.getElementById('confirm-modal').classList.add('show');
    }

    function closeConfirm() {
        document.getElementById('confirm-modal').classList.remove('show');
        deleteId = null;
    }

    document.getElementById('confirm-yes-btn').addEventListener('click', async () => {
        if (!deleteId) return;
        const data = await merciaApi(`/api/staff/${deleteId}`, { method: 'DELETE' });
        if (data.success) { showToast(data.message, 'success'); fetchStaff(); }
        else showToast(data.message || 'Delete failed.', 'error');
        closeConfirm();
    });

    document.getElementById('staff-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
    document.getElementById('confirm-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeConfirm(); });

    document.addEventListener('DOMContentLoaded', fetchStaff);
</script>
</body>
</html>
